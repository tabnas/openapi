openapi: 3.1.0
$self: https://api.example.com/openapi.yaml
info: { title: Pets, version: "1" }
paths:
  /pets:
    get:
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/PetList'
          description: Overrides the component description
        '404':
          $ref: 'openapi.yaml#/components/responses/Missing'
      requestBody: { content: { application/json: { schema: { $ref: 'https://schemas.example.com/pet.json#/$defs/Owner' } } } }
  /pets/{id}:
    get:
      responses:
        '200':
          $ref: '#/paths/~1pets/get/responses/200'
  /pets/{id}/photos:
    $ref: '#/components/pathItems/Photos'
    summary: Photos of one pet
components:
  pathItems:
    Photos:
      get: { responses: { '200': { description: Photos } } }
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer } }
  responses:
    PetList:
      description: A page of pets
      content:
        application/json:
          schema: { type: array, items: { $ref: '#/components/schemas/Pet' } }
          example: { $ref: '#/components/schemas/Pet', note: data }
    Missing: { $ref: '#/components/responses/NotFound' }
    NotFound: { description: Not found }
  schemas:
    Pet:
      $id: https://schemas.example.com/pet.json
      type: object
      properties:
        name: { $ref: '#name' }
        friends: { type: array, items: { $ref: '#' } }
        owner: { $ref: 'https://example.com/schemas/person.json' }
        tag: { $ref: 'tag.json', description: The pet's tag }
        any: { $dynamicRef: '#meta' }
      $defs:
        Name: { $anchor: name, type: string }
        Owner: { $ref: 'owner.json' }
    Owner: { $id: https://schemas.example.com/owner.json, type: string }
    Tag: { $id: https://schemas.example.com/tag.json, type: string }
    Encoded: { $ref: '#/components%2Fschemas/Tag' }
    __proto__: { type: string }
x-vendor: { $ref: '#/components/schemas/Tag', keep: literal }

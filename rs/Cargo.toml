[package]
name = "tabnas-openapi"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "OpenAPI and Swagger documents, in JSON or YAML, for the tabnas parsing engine: the document as written, or with its references resolved"
repository = "https://github.com/tabnas/openapi"

[lib]
name = "tabnas_openapi"
path = "src/lib.rs"

[dependencies]
# The engine and the grammars this plugin composes are consumed as SIBLING
# CHECKOUTS, the standard tabnas development model: clone
# https://github.com/tabnas/parser, https://github.com/tabnas/json,
# https://github.com/tabnas/jsonic and https://github.com/tabnas/yaml next
# to this repo. They are on crates.io, but this committed manifest stays
# path-only (crates-release.yml rewrites the paths into crates.io
# requirements when it publishes), so there is no registry version to fall
# back on. tabnas-json reads strict JSON; tabnas-jsonic with tabnas-yaml
# reads JSON and YAML.
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }
tabnas-json = { path = "../../json/rs" }
tabnas-jsonic = { path = "../../jsonic/rs" }
tabnas-yaml = { path = "../../yaml/rs" }
indexmap = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The shared fixture loader and runner: one loader in three languages, so
# the rows mean the same thing in every runtime.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
# The introspection plugin, for tests/debug_model_test.rs: the Rust half
# of ts/test/debug-model.test.ts, which proves the plugin composes with
# it and adds no grammar. Tests only, and a sibling checkout like the
# rest: clone https://github.com/tabnas/debug.
tabnas-debug = { path = "../../debug/rs" }
# serde_json parses a long number with best-effort precision by default
# and can land one ulp off, where Go's strconv and JavaScript's
# JSON.parse are exact; `float_roundtrip` makes the expected value in a
# fixture the double the other two runtimes read.
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
